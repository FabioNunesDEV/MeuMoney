schema: spec-driven

context: |
  Aplicativo desktop pessoal de gestão financeira (referência funcional: Money 99). Uso individual, não comercial.
  Stack: C#, .NET 10, WPF + WPF-UI, MVVM (CommunityToolkit.Mvvm), EF Core.
  Arquitetura em camadas, um único executável: Money.Domain <- Money.Services <- Money.Data <- Money.Desktop.
  Domain não referencia projetos. Services define as interfaces de repositório e depende só de Domain.
  Data implementa a persistência sem conhecer o provedor. Desktop é o composition root.
  Cada projeto expõe uma extensão AddMoney* para registro na injeção de dependência.
  O provedor de banco fica em projeto próprio (Money.Data.Sqlite, com as migrations).
  Trocar para SQL Server = criar Money.Data.SqlServer com o mesmo padrão e escolher o provedor em Money.Desktop.
  Services não conhece UI, usa métodos assíncronos com CancellationToken e devolve DTOs, nunca entidades.
  Nenhum tipo de interface (WPF, diálogos, caminhos de arquivo) em Domain, Services ou Data: pode haver interface web no futuro.
  Valores monetários em decimal. Usar TimeProvider, nunca DateTime.Now.
  Organizar pastas internas por módulo funcional, não por tipo técnico.
  Identificadores em português, sem acento (Conta, Lancamento, ObterPorIdAsync); normas completas no CLAUDE.md.
  Artefatos do OpenSpec em pt-BR.
  Money 99 é referência só funcional (prints em imagens_tela/<Modulo>/, com dados reais: não copiar valores).
  Visual segue o Fluent Design do Windows 11 com WPF-UI; regras na seção "Interface visual" do CLAUDE.md.

